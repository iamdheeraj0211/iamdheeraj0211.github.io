<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>og image</title>
<!-- Social preview image (1200x630), rendered by tools/capture.js into assets/og.png. -->
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 90px; box-sizing: border-box;
    background:
      radial-gradient(45% 60% at 18% 25%, rgba(52, 211, 153, 0.22), transparent 70%),
      radial-gradient(40% 55% at 85% 20%, rgba(56, 189, 248, 0.18), transparent 70%),
      #0b0f14;
    color: #e8eef4;
    font-family: Inter, "Segoe UI", Arial, sans-serif;
  }
  .mark { width: 72px; height: 72px; border-radius: 18px; display: grid; place-items: center; font-size: 40px; font-weight: 800; color: #04121c; background: linear-gradient(135deg, #34d399, #38bdf8); }
  h1 { margin: 34px 0 0; font-size: 82px; letter-spacing: -0.035em; line-height: 1; }
  p { margin: 18px 0 0; font-size: 32px; color: #c6d1dc; }
  .tags { display: flex; gap: 14px; margin-top: 40px; }
  .tags span { padding: 10px 22px; border-radius: 999px; border: 1px solid #2b3a4c; background: #131b24; font-size: 24px; }
  .url { position: absolute; right: 90px; bottom: 56px; font-size: 24px; color: #93a1b0; }
</style>
</head>
<body>
  <div class="mark">D</div>
  <h1>Dheeraj Deokar</h1>
  <p>Python developer · Django, PostgreSQL, React, AWS</p>
  <div class="tags"><span>EarlyApply</span><span>Bizznify ERP</span></div>
  <div class="url">iamdheeraj0211.github.io</div>
</body>
</html>
